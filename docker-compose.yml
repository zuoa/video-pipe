services:
  # MediaMTX: the conversion core. Accepts our ffmpeg RTSP push and republishes
  # the same stream as RTSP/RTMP/HLS/WebRTC/SRT.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: video-pipe-mediamtx
    restart: unless-stopped
    # WebRTC media (DTLS/SRTP) cannot reliably traverse Docker's bridge NAT:
    # ICE connects via STUN, but the DTLS handshake / fragmented UDP media never
    # completes back to the browser, so the page loads yet video never connects.
    # This was verified — MediaMTX's own /read page fails the same way under
    # bridge networking. Host networking removes the NAT entirely; all ports
    # then bind directly on the host and WebRTC works. Requires a Linux host
    # (host networking is not honored by Docker Desktop on macOS/Windows).
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  # video-pipe: scheduling/management layer (this repo). The image is built and
  # published by GitHub Actions (see .github/workflows/ci.yml); this compose file
  # only PULLS it — there is no local build step. Set VIDEOPIPE_IMAGE in a .env
  # file (see .env.example) or the environment.
  video-pipe:
    image: ${VIDEOPIPE_IMAGE:?create .env from .env.example and set VIDEOPIPE_IMAGE}
    container_name: video-pipe
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - mediamtx
    # mediamtx now runs on the host network, so reach it through the host
    # gateway instead of the Docker bridge DNS name "mediamtx".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADDR: ":8080"
      DB_PATH: "/data/video-pipe.db"
      MEDIAMTX_API: "http://host.docker.internal:9997"   # mediamtx is on the host network
      MEDIAMTX_HOST: "host.docker.internal"              # host ffmpeg pushes RTSP to
      MEDIAMTX_USER: "wrapper"               # must match authInternalUsers in mediamtx.yml
      MEDIAMTX_PASS: "change-me"
      PLAYBACK_HOST: "${PLAYBACK_HOST:-localhost}"  # override in .env; host browsers use to reach MediaMTX
      UPLOAD_DIR: "/data/uploads"            # uploaded source files (under mounted ./data)
      PROVIDER_CACHE_DIR: "${PROVIDER_CACHE_DIR:-/data/provider-cache}"  # downloaded Bilibili VODs for local looping
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-0}"  # single-upload size cap; 0 = unlimited
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
